name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: Website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npx ng test --no-watch
      - run: npx ng build

  api:
    name: API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rychta
          POSTGRES_PASSWORD: rychta
          POSTGRES_DB: rychta_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rychta -d rychta_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RC_DATABASE_URL: postgres://rychta:rychta@localhost:5432/rychta_test
      RC_TEST_DATABASE_URL: postgres://rychta:rychta@localhost:5432/rychta_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - name: Migrations apply to an empty database and match the entities
        run: |
          npm run typeorm -- migration:run
          npm run migration:check
      - run: npm run test:e2e

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build --tag rychta-cenkovice:ci .
