name: Showcase

# Static demo of the website on GitHub Pages: the API is replaced by an in-browser fake with the
# data from the demo-data release (see docs/showcase.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # Photos and data of the fake API live outside git, as an asset of the demo-data release.
      - run: gh release download demo-data --pattern demo-data.zip && unzip -q demo-data.zip
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npx ng build --configuration demo --base-href "/${{ github.event.repository.name }}/"
      # Pages has no rewrites: unknown paths get 404.html, which then starts the router.
      - run: cp dist/web/browser/index.html dist/web/browser/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist/web/browser

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
