    <link

    <style>
      /* Boot loader: shown until Angular has rendered the first page. */
      html {
        background: #f3f5f4;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] #boot {
        background: #14191d;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: #f3f5f4;
        transition:
          opacity 0.45s ease,
          visibility 0.45s;
      }
      #boot.is-done {
        opacity: 0;
        visibility: hidden;
      }
      #boot svg {
        width: min(34vw, 150px);
        height: auto;
        overflow: visible;
      }
      #boot .gable {
        stroke-dasharray: 150;
        stroke-dashoffset: 150;
        animation: boot-draw 1.1s cubic-bezier(0.6, 0, 0.2, 1) forwards;
      }
      #boot .fill {
        opacity: 0;
        animation: boot-in 0.5s 0.75s ease forwards;
      }
      #boot .board {
        stroke-dasharray: 46;
        stroke-dashoffset: 46;
        animation: boot-board 1.8s 1s cubic-bezier(0.6, 0, 0.2, 1) infinite;
      }
      #boot .board + .board {
        animation-delay: 1.18s;
      }
      #boot .plinth {
        transform: translateY(6px);
        opacity: 0;
        animation: boot-plinth 0.5s 0.5s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
      }
      #boot p {
        margin: 18px 0 0;
        font:
          800 26px/1 'Sofia Sans Extra Condensed',
          'Arial Narrow',
          sans-serif;
        letter-spacing: 0.01em;
        color: #232a30;
        text-align: center;
        opacity: 0;
        animation: boot-in 0.5s 0.6s ease forwards;
      }
      @keyframes boot-draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      @keyframes boot-in {
        to {
          opacity: 1;
        }
      }
      @keyframes boot-plinth {
        to {
          transform: none;
          opacity: 1;
        }
      }
      @keyframes boot-board {
        0% {
          stroke-dashoffset: 46;
        }
        45%,
        70% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: -46;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .gable,
        #boot .board {
          animation: none;
          stroke-dashoffset: 0;
        }
        #boot .fill,
        #boot .plinth,
        #boot p {
          animation: none;
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" role="status" aria-label="Načítání / Loading">
      <div>
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path class="fill" fill="#8c2a1d" d="M24 2 45 32H3z" />
          <path
            class="gable"
            fill="none"
            stroke="#8c2a1d"
            stroke-width="1.6"
            d="M3 32 24 2 45 32z"
          />
          <path
            class="board"
            fill="none"
            stroke="#f3f5f4"
            stroke-width="2.4"
            d="M11.5 32 24 14.2 36.5 32"
          />
          <path
            class="board"
            fill="none"
            stroke="#f3f5f4"
            stroke-width="2.4"
            d="M19.5 32 24 25.6 28.5 32"
          />
          <g class="plinth">
            <path fill="#232a30" d="M6 34h36v12H6z" />
            <path fill="#8c2a1d" d="M12 37.5h6v5h-6zM30 37.5h6v5h-6z" />
          </g>
        </svg>
        <p>Rychta Čenkovice</p>
      </div>
    </div>

    >
  </body>
</html>
