<div class="a-head">
  <h1>{{ t().admin.news.title }}</h1>
  <div class="a-actions">
    <button type="button" class="btn" (click)="start(null)">
      <rc-icon name="plus" /> {{ t().admin.news.new }}
    </button>
  </div>
</div>

@if (editing(); as open) {
  <rc-news-editor [item]="open.item" (saved)="done()" (cancelled)="editing.set(null)" />
}

@if (items(); as list) {
  @if (list.length) {
    <rc-news-table [items]="list" (edit)="start($event)" (remove)="remove($event)" />
  } @else {
    <p class="a-empty">{{ failed() ? t().common.loadFailed : t().admin.news.empty }}</p>
  }
} @else {
  <rc-spinner [label]="t().common.loading" />
}
