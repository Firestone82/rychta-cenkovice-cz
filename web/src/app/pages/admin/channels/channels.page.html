@let text = t().admin.channels;
<div class="a-head">
  <div>
    <h1>{{ text.title }}</h1>
    <p>{{ text.lead }}</p>
  </div>
</div>

@if (rows(); as list) {
  @if (list.length) {
    <rc-channel-list
      [rows]="list"
      [busyId]="syncing()"
      (edit)="editing.set($event)"
      (sync)="sync($event)"
      (disconnect)="disconnect($event)"
    />
  } @else {
    <p class="a-empty">{{ failed() ? t().common.loadFailed : '' }}</p>
  }
} @else {
  <rc-spinner [label]="t().common.loading" />
}

@if (editing(); as open) {
  <rc-channel-editor
    [apartment]="open.apartment"
    [channel]="open.channel"
    (saved)="stored()"
    (closed)="editing.set(null)"
  />
}
