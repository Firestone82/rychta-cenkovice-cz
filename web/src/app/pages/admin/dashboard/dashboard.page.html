<div class="a-head">
  <div>
    <h1>{{ t().admin.dashboard.title }}</h1>
    <!-- The line keeps its place while the date is on its way, so the heading does not move. -->
    <p>
      {{
        today()
          ? i18n.fill(t().admin.dashboard.lead, { date: i18n.date(today(), 'long') })
          : '\u00a0'
      }}
    </p>
  </div>
  <div class="a-actions">
    <a class="btn" routerLink="/admin/bookings/new"
      ><rc-icon name="plus" /> {{ t().admin.dashboard.newBooking }}</a
    >
  </div>
</div>

<ng-template #overview let-d>
  <rc-dashboard-stats [data]="d" />
  <rc-dashboard-pending
    [bookings]="d.pending"
    [apartments]="apartments()"
    [busyId]="busy()"
    (decide)="decide($event)"
  />

  <div class="two">
    <rc-dashboard-movements kind="arrivals" [bookings]="d.arrivals" [apartments]="apartments()" />
    <rc-dashboard-movements
      kind="departures"
      [bookings]="d.departures"
      [apartments]="apartments()"
    />
  </div>
</ng-template>

@if (data(); as d) {
  <ng-container [ngTemplateOutlet]="overview" [ngTemplateOutletContext]="{ $implicit: d }" />
} @else if (failed()) {
  <p class="notice is-error" role="alert">{{ t().common.loadFailed }}</p>
} @else {
  <rc-admin-skeleton [label]="t().common.loading">
    <ng-container
      [ngTemplateOutlet]="overview"
      [ngTemplateOutletContext]="{ $implicit: placeholder }"
    />
  </rc-admin-skeleton>
}
