<div class="a-head">
  <div>
    <h1>{{ t().admin.messages.title }}</h1>
    <p>{{ t().admin.messages.lead }}</p>
  </div>
</div>

<div class="a-filters">
  <div class="a-seg" role="group" [attr.aria-label]="t().admin.messages.title">
    <button type="button" [attr.aria-pressed]="box() === ''" (click)="box.set('')">
      {{ t().admin.messages.filterInbox }}
    </button>
    <button type="button" [attr.aria-pressed]="box() === 'archived'" (click)="box.set('archived')">
      {{ t().admin.messages.filterArchived }}
    </button>
  </div>
</div>

@if (items(); as list) {
  @if (list.length) {
    <ul class="list">
      @for (m of list; track m.id) {
        <li class="a-card" [class.is-new]="m.status === 'new'">
          <rc-message-card
            [message]="m"
            [busy]="busy() === m.id"
            (status)="set(m, $event)"
            (remove)="remove(m)"
          />
        </li>
      }
    </ul>
  } @else {
    <p class="a-empty">{{ failed() ? t().common.loadFailed : t().admin.messages.empty }}</p>
  }
} @else {
  <rc-admin-skeleton [label]="t().common.loading">
    <ul class="list">
      @for (m of placeholders; track m.id) {
        <li class="a-card"><rc-message-card [message]="m" /></li>
      }
    </ul>
  </rc-admin-skeleton>
}
