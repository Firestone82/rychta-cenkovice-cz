<div class="a-head">
  <div>
    <h1>{{ t().admin.bookings.title }}</h1>
    <p>{{ t().admin.bookings.lead }}</p>
  </div>
  @if (canEdit()) {
    <div class="a-actions">
      <a class="btn btn-quiet" routerLink="/admin/bookings/new" [queryParams]="{ kind: 'block' }">{{
        t().admin.bookings.newBlock
      }}</a>
      <a class="btn" routerLink="/admin/bookings/new"
        ><rc-icon name="plus" /> {{ t().admin.bookings.new }}</a
      >
    </div>
  }
</div>

<rc-booking-filters [(filter)]="filter" (searchChange)="search.set($event)" />

@if (items(); as list) {
  @if (list.length) {
    <rc-booking-table
      [bookings]="list"
      [apartments]="apartments()"
      [busyId]="busy()"
      [readOnly]="!canEdit()"
      (decide)="decide($event)"
    />
  } @else {
    <p class="a-empty">{{ failed() ? t().common.loadFailed : t().admin.bookings.empty }}</p>
  }
} @else {
  <rc-admin-skeleton [label]="t().common.loading">
    <rc-booking-table
      [bookings]="placeholders"
      [apartments]="apartments()"
      [busyId]="null"
      [readOnly]="!canEdit()"
    />
  </rc-admin-skeleton>
}
