<label [for]="key()">
  {{ label() }}
  @if (optional()) {
    <span class="opt">({{ optional() }})</span>
  }
</label>
@if (type() === 'textarea') {
  <textarea
    [id]="key()"
    class="input"
    [class.compact]="compact()"
    [rows]="rows()"
    [attr.maxlength]="maxlength()"
    [required]="required()"
    [attr.placeholder]="placeholder() || null"
    [attr.lang]="lang() || null"
    [value]="value()"
    (input)="value.set(valueOf($event))"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="key() + '-msg'"
  ></textarea>
} @else {
  <input
    [id]="key()"
    class="input"
    [type]="type()"
    [required]="required()"
    [disabled]="disabled()"
    [attr.autocomplete]="autocomplete() || null"
    [attr.inputmode]="inputmode() || null"
    [attr.placeholder]="placeholder() || null"
    [attr.lang]="lang() || null"
    [attr.min]="min() ?? null"
    [attr.max]="max() ?? null"
    [attr.step]="step() ?? null"
    [attr.maxlength]="maxlength()"
    [value]="value()"
    (input)="value.set(valueOf($event))"
    [attr.aria-invalid]="error() ? 'true' : null"
    [attr.aria-describedby]="key() + '-msg'"
  />
}
<div [id]="key() + '-msg'" class="msg">
  @if (error()) {
    <p class="error">{{ error() }}</p>
  } @else if (hint()) {
    <p class="hint">{{ hint() }}</p>
  }
</div>
