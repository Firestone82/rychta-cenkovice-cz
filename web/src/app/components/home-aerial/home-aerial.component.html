<section class="aerial section-dark" aria-labelledby="aerial-title">
  <div class="wrap aerial-grid">
    <div class="aerial-text">
      <h2 id="aerial-title" class="h1">{{ t().home.aerial.title }}</h2>
      <p class="lead muted">{{ t().home.aerial.text }}</p>
    </div>
    <div class="aerial-video">
      <video
        #player
        loop
        playsinline
        preload="none"
        [muted]="true"
        [poster]="poster"
        [attr.aria-label]="t().home.aerial.alt"
        (fullscreenchange)="fullScreenChanged()"
        (webkitendfullscreen)="fullScreenChanged()"
      >
        <source [src]="video.src" type="video/mp4" />
      </video>
      <button
        type="button"
        class="open"
        [attr.aria-label]="t().home.aerial.fullScreen"
        [title]="t().home.aerial.fullScreen"
        (click)="openFullScreen()"
      >
        <rc-icon name="expand" />
      </button>
    </div>
  </div>
</section>
