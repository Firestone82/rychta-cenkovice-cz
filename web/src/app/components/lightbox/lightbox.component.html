<!-- Esc closes a dialog by itself; the click handler only catches the backdrop. -->
<!-- eslint-disable-next-line @angular-eslint/template/interactive-supports-focus -->
<dialog
  #dialog
  class="on-dark"
  (close)="index.set(null)"
  (click)="backdrop($event)"
  (keydown)="key($event)"
  [attr.aria-label]="counter()"
>
  @if (current(); as slide) {
    <figure (touchstart)="touchStart($event)" (touchend)="touchEnd($event)">
      <div
        class="frame"
        [style.aspect-ratio]="slide.width + ' / ' + slide.height"
        [style.max-width]="'min(100%, ' + slide.width + 'px)'"
        [style.background-image]="slide.placeholder ? 'url(' + slide.placeholder + ')' : null"
      >
        <!-- A one-item loop keyed by file recreates the image, so the previous one never lingers. -->
        @for (s of [slide]; track s.src) {
          <img
            [src]="s.src"
            [attr.srcset]="s.srcset"
            sizes="100vw"
            [alt]="s.alt"
            [attr.width]="s.width"
            [attr.height]="s.height"
          />
        }
      </div>
      <figcaption>
        <span>{{ slide.alt }}</span>
        <span class="count" aria-live="polite">{{ counter() }}</span>
      </figcaption>
    </figure>
    <button
      type="button"
      class="ctl close"
      (click)="close()"
      [attr.aria-label]="i18n.t().common.close"
    >
      <rc-icon name="close" />
    </button>
    @if (slides().length > 1) {
      <button
        type="button"
        class="ctl prev"
        (click)="step(-1)"
        [attr.aria-label]="i18n.t().common.previous"
      >
        <rc-icon name="left" />
      </button>
      <button
        type="button"
        class="ctl next"
        (click)="step(1)"
        [attr.aria-label]="i18n.t().common.next"
      >
        <rc-icon name="right" />
      </button>
    }
  }
</dialog>
