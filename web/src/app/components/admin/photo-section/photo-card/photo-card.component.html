@let p = photo();
<img
  [src]="media.photoUrl(p, p.widths[0])"
  [attr.srcset]="media.srcset(p)"
  sizes="320px"
  [alt]="p.alt.cs"
  [width]="p.width"
  [height]="p.height"
  loading="lazy"
  decoding="async"
  [style.background-color]="p.color"
/>
<p class="alt">{{ p.alt.cs }}</p>
<div class="actions">
  <button type="button" class="btn btn-small btn-quiet edit" (click)="edit.emit()">
    <rc-icon name="edit" />
    <span class="text">{{ t().admin.photos.edit }}</span>
  </button>
  <button
    type="button"
    class="a-icon-btn is-danger"
    [rcBusy]="busy()"
    (click)="remove()"
    [attr.aria-label]="t().admin.photos.delete + ': ' + p.alt.cs"
  >
    <rc-icon name="trash" />
  </button>
</div>
