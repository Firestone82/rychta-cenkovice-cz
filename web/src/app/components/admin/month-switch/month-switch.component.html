<div class="bar">
  <button type="button" class="btn btn-quiet btn-small" (click)="move(-1)">
    <rc-icon name="left" /> {{ labels().prev }}
  </button>
  <button
    type="button"
    class="btn btn-quiet btn-small"
    (click)="month.set(thisMonth)"
    [disabled]="isNow()"
  >
    {{ labels().now }}
  </button>
  <button type="button" class="btn btn-quiet btn-small" (click)="move(1)">
    {{ labels().next }} <rc-icon name="right" />
  </button>
  <div class="end"><ng-content /></div>
</div>
