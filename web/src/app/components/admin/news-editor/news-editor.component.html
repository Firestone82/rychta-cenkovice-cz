@let d = draft();
@let text = t().admin.news;
<form class="a-card editor" (submit)="save($event)" novalidate>
  <h2>{{ d.id ? text.edit : text.new }}</h2>
  <div class="form-grid">
    <rc-text-field
      key="n-title-cs"
      lang="cs"
      [label]="text.titleCs"
      [error]="errors()['title_cs']"
      [value]="d.title.cs"
      (valueChange)="setText('title', 'cs', $event)"
    />
    <rc-text-field
      key="n-title-en"
      lang="en"
      [label]="text.titleEn"
      [value]="d.title.en"
      (valueChange)="setText('title', 'en', $event)"
    />
    <rc-text-field
      key="n-body-cs"
      type="textarea"
      [rows]="8"
      lang="cs"
      [label]="text.bodyCs"
      [error]="errors()['body_cs']"
      [value]="d.body.cs"
      (valueChange)="setText('body', 'cs', $event)"
    />
    <rc-text-field
      key="n-body-en"
      type="textarea"
      [rows]="8"
      lang="en"
      [label]="text.bodyEn"
      [value]="d.body.en"
      (valueChange)="setText('body', 'en', $event)"
    />
    <rc-text-field
      key="n-date"
      type="date"
      [label]="text.date"
      [error]="errors()['published_at']"
      [value]="d.published_at"
      (valueChange)="patch({ published_at: $event })"
    />
    <label class="check publish">
      <input
        type="checkbox"
        [checked]="d.published"
        (change)="patch({ published: checked($event) })"
      />
      <span>{{ text.published }}</span>
    </label>
  </div>
  @if (failure()) {
    <p class="notice is-error" role="alert">{{ failure() }}</p>
  }
  <div class="a-actions">
    <button class="btn" type="submit" [disabled]="busy()">{{ text.save }}</button>
    <button class="btn btn-quiet" type="button" (click)="cancelled.emit()">
      {{ t().admin.common.cancel }}
    </button>
  </div>
</form>
