@if (layout() === 'boxes') {
  <rc-year-boxes
    [months]="months()"
    [today]="today"
    [loading]="loading()"
    (month)="month.emit($event)"
  />
} @else {
  <rc-year-rows
    [year]="year()"
    [months]="months()"
    [today]="today"
    [loading]="loading()"
    (month)="month.emit($event)"
  />
}

<ul class="legend">
  @for (level of levels; track level) {
    <li><span class="key" [class]="'is-' + level"></span>{{ t().admin.calendar.levels[level] }}</li>
  }
  @if (layout() === 'rows') {
    <li><span class="key weekend"></span>{{ t().admin.calendar.weekend }}</li>
  }
  <li class="note">{{ i18n.fill(t().admin.calendar.counted, { total: total() }) }}</li>
</ul>
