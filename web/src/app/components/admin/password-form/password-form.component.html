@let text = t().admin.account;
<form class="a-card" (submit)="save($event)" novalidate>
  <h2>{{ text.changePassword }}</h2>
  <!-- lets password managers attach the new password to the right account -->
  <input
    class="sr-only"
    type="text"
    autocomplete="username"
    tabindex="-1"
    aria-hidden="true"
    [value]="auth.user()?.email ?? ''"
    readonly
  />
  <rc-text-field
    key="ac-current"
    type="password"
    autocomplete="current-password"
    [required]="true"
    [label]="text.current"
    [error]="errors()['current']"
    [(value)]="current"
  />
  <rc-text-field
    key="ac-next"
    type="password"
    autocomplete="new-password"
    [required]="true"
    [label]="text.next"
    [hint]="text.nextHint"
    [error]="errors()['next']"
    [(value)]="next"
  />
  <rc-text-field
    key="ac-repeat"
    type="password"
    autocomplete="new-password"
    [required]="true"
    [label]="text.repeat"
    [error]="errors()['repeat']"
    [(value)]="repeat"
  />
  @if (failure()) {
    <p class="notice is-error" role="alert">{{ failure() }}</p>
  }
  <button class="btn" type="submit" [rcBusy]="busy()">{{ text.save }}</button>
</form>
