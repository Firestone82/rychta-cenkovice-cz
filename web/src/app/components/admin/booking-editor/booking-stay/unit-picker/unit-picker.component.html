<fieldset class="units">
  <legend>{{ t().admin.bookings.units }}</legend>
  <ul>
    @for (a of apartments(); track a.id) {
      <li>
        <label
          class="unit"
          [class.is-on]="selected().includes(a.id)"
          [class.is-taken]="taken().has(a.id)"
        >
          <input
            type="checkbox"
            [checked]="selected().includes(a.id)"
            (change)="toggled.emit({ id: a.id, on: checked($event) })"
          />
          <span class="num">{{ a.number }}</span>
          <span class="unit-text">
            <strong class="unit-name">{{ i18n.apartment(a) }}</strong>
            <span
              >{{ i18n.count(a.beds, t().plural.beds) }}, {{ t().common.floor[a.floor - 1] }}</span
            >
            @if (taken().get(a.id); as holder) {
              <strong class="clash" [title]="holder"
                >{{ t().admin.bookings.unitTaken }}: {{ holder }}</strong
              >
            }
          </span>
        </label>
      </li>
    }
  </ul>
  @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
  }
</fieldset>
