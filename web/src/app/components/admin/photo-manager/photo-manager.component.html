@if (problems().length) {
  <ul class="notice is-error problems" role="alert">
    @for (p of problems(); track p) {
      <li>{{ p }}</li>
    }
  </ul>
}

@if (photos()) {
  <div class="sections" [attr.data-size]="size()">
    @for (group of groups(); track group.key) {
      <rc-photo-section
        [key]="group.key"
        [heading]="group.heading"
        [photos]="group.photos"
        [open]="!collapsed().includes(group.key)"
        [progress]="uploading()?.key === group.key ? progress() : ''"
        [busy]="!!uploading()"
        (openChange)="setOpen(group.key, $event)"
        (files)="upload(group, $event)"
        (edit)="editing.set($event)"
        (removed)="drop($event)"
      />
    }
  </div>
} @else if (failed()) {
  <p class="a-empty">{{ t().common.loadFailed }}</p>
} @else {
  <rc-admin-skeleton kind="list" [count]="4" [label]="t().common.loading" />
}

@if (editing(); as photo) {
  <rc-photo-editor [photo]="photo" (saved)="replace($event)" (closed)="editing.set(null)" />
}
