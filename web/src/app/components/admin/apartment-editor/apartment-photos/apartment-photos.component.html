@if (problems().length) {
  <ul class="notice is-error" role="alert">
    @for (p of problems(); track p) {
      <li>{{ p }}</li>
    }
  </ul>
}
<ng-template #section let-list>
  <rc-photo-section
    [key]="'apartment-editor-' + apartment().id"
    [heading]="t().admin.apartments.photos"
    [photos]="list"
    [progress]="progress()"
    [busy]="!!uploading()"
    (files)="upload($event)"
    (edit)="editing.set($event)"
    (removed)="drop($event)"
  />
  <p class="hint">{{ t().admin.apartments.photosHint }}</p>
</ng-template>

@if (photos(); as list) {
  <ng-container [ngTemplateOutlet]="section" [ngTemplateOutletContext]="{ $implicit: list }" />
} @else if (failed()) {
  <p class="a-empty">{{ t().common.loadFailed }}</p>
} @else if (active()) {
  <rc-admin-skeleton [label]="t().common.loading">
    <ng-container
      [ngTemplateOutlet]="section"
      [ngTemplateOutletContext]="{ $implicit: placeholders }"
    />
  </rc-admin-skeleton>
}

@if (editing(); as photo) {
  <rc-photo-editor [photo]="photo" (saved)="replace($event)" (closed)="editing.set(null)" />
}
